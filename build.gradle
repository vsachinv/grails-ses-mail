// ---- Buildscript ------------------------------------------------------------
// The Apache Grails Gradle plugin is not published to the Gradle Plugin Portal,
// so it is resolved on the buildscript classpath and applied via `apply plugin`.
// The grails-bom platform pins the Grails Gradle plugin version to $grailsVersion.
buildscript {
    repositories {
        mavenLocal()
        mavenCentral()
        maven { url = "https://repo.grails.org/grails/core" }
    }
    dependencies {
        classpath platform("org.apache.grails:grails-bom:$grailsVersion")
        classpath "org.apache.grails:grails-gradle-plugins"
        classpath "com.gorylenko.gradle-git-properties:gradle-git-properties:4.0.1"
    }
}

apply plugin: "groovy"
apply plugin: "java-library"
apply plugin: "maven-publish"
// Grails 7 PLUGIN project. NOTE: use grails-plugin, NOT grails-web — the
// grails-web plugin is application-only in Grails 7 and fails a plugin build
// with "cannot be both a Grails application and a Grails plugin".
apply plugin: "org.apache.grails.gradle.grails-plugin"
apply plugin: "com.gorylenko.gradle-git-properties"

group   "org.grails.plugins"
version "${version}"

repositories {
    mavenLocal()
    mavenCentral()
    maven { url "https://repo.grails.org/grails/core" }
}

dependencies {

    // The grails-bom platform aligns every Grails + Spring Boot module version
    // to $grailsVersion, so the coordinates below are declared without versions.
    implementation platform("org.apache.grails:grails-bom:$grailsVersion")
    // grails-micronaut-bom imports the Micronaut platform BOM (micronaut-inject-groovy
    // etc.), whose versions the plain grails-bom does not manage transitively.
    implementation platform("org.apache.grails:grails-micronaut-bom:$grailsVersion")

    // ---- Grails core --------------------------------------------------------
    implementation "org.apache.grails:grails-core"
    implementation "org.apache.grails:grails-services"
    // grails-controllers provides the artefact/trait support for the SNS
    // handler controller and URL mappings (was pulled in via grails-web on G6).
    implementation "org.apache.grails:grails-controllers"
    implementation "org.apache.grails:grails-web-boot"
    implementation "org.springframework.boot:spring-boot-autoconfigure"
    implementation "org.springframework.boot:spring-boot-starter-logging"
    compileOnly     "io.micronaut:micronaut-inject-groovy"

    // ---- grails-mail --------------------------------------------------------
    // As of Apache Grails 7 grails-mail is a core BOM artifact
    // (org.apache.grails:grails-mail). Declared compileOnly: the consuming
    // application brings it in; this plugin overrides the 'mailSender' bean.
    compileOnly "org.apache.grails:grails-mail"

    // ---- asynchronous-mail (optional) ---------------------------------------
    // Declared compileOnly so applications that do not use async-mail are not
    // forced to pull it in.  The plugin detects it at runtime via loadAfter.
    // Third-party plugin (not part of the Grails BOM); only referenced by name.
    compileOnly("io.github.gpc:asynchronous-mail:3.1.2") {
        exclude group: "org.grails.plugins", module: "mongodb"
    }

    // ---- Spring Mail --------------------------------------------------------
    // Provides JavaMailSender, MimeMessageHelper, etc. (jakarta.mail on SB3).
    // Comes transitively via grails-mail; kept explicit for IDE support.
    implementation "org.springframework.boot:spring-boot-starter-mail"

    // ---- AWS SDK v2 – SES v2 API --------------------------------------------
    // Core dependency of this plugin.  Uses the BOM to align all SDK module
    // versions without needing to specify each one individually.
    implementation platform("software.amazon.awssdk:bom:2.25.28")
    implementation "software.amazon.awssdk:sesv2"
    implementation "software.amazon.awssdk:auth"

    // ---- Test ---------------------------------------------------------------
    testImplementation "org.apache.grails:grails-mail"
    testImplementation "org.spockframework:spock-core"
    testImplementation "org.apache.grails.testing:grails-testing-support-core"
    testImplementation "org.apache.grails:grails-testing-support-web"
    testImplementation "io.micronaut:micronaut-inject-groovy"
    testImplementation "org.apache.grails:grails-services"
    // Spock needs a bytecode-gen library to mock concrete classes; no longer
    // transitive in Grails 7, so declare it explicitly (BOM-managed version).
    testImplementation "net.bytebuddy:byte-buddy"
    testRuntimeOnly    "net.bytebuddy:byte-buddy-agent"
}

bootJar {
    enabled = false
}

// Grails 7 requires Java 17+. Control the source/target release here; the JVM
// that runs the build is selected via org.gradle.java.home in gradle.properties.
compileJava.options.release = 17

// Known Grails 7.0.x Groovy compilation issue with invokedynamic:
// https://github.com/apache/grails-core/issues/15321
tasks.withType(GroovyCompile).configureEach {
    groovyOptions.optimizationOptions.indy = false
}

tasks.withType(Test) {
    useJUnitPlatform()
}

// ---- Git version capture ----------------------------------------------------
// Mirrors the approach used in mail-oauth.
// Captures branch, full commit id, abbreviated commit id, and commit timestamp
// into git.properties at build time.  The properties are also embedded into
// the JAR manifest so the exact source revision is visible in Nexus, the
// runtime actuator, or a simple `jar tf` inspection.

gitProperties {
    keys = ['git.branch', 'git.commit.id', 'git.commit.id.abbrev', 'git.commit.time']
    // Fail the build when no .git directory is found.
    // Set to false if building from a source archive that has no git history.
    failOnNoGitDirectory = true
    // Expose git properties as project.ext.gitProps for use in the jar manifest.
    extProperty = 'gitProps'
}

// Always re-run generateGitProperties so the commit info is never stale,
// even when git.properties content has not changed.
generateGitProperties.outputs.upToDateWhen { false }

// ---- Publishing -------------------------------------------------------------

jar {
    dependsOn generateGitProperties
    manifest {
        attributes(
            'Built-By'              : System.getProperty('user.name'),
            'Plugin-Version'        : version,
            'Plugin-Title'          : project.name,
            'Plugin-Build-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ"),
            'Git-Commit'            : "${-> project.ext.gitProps['git.commit.id.abbrev']}",
            'Git-Branch'            : "${-> project.ext.gitProps['git.branch']}",
            'Git-Commit-Full'       : "${-> project.ext.gitProps['git.commit.id']}",
            'Git-Commit-Time'       : "${-> project.ext.gitProps['git.commit.time']}"
        )
    }
    from sourceSets.main.output
    // git.properties is captured in the manifest above; exclude the file
    // itself so it does not bloat the JAR or leak into classpath scanning.
    exclude 'git.properties'
}

task sourceJar(type: Jar) {
    archiveClassifier.set("sources")
    // gradle-git-properties registers its generated output on the main source
    // set; allSource therefore pulls it in. Declare the dependency (Gradle 8
    // strict validation) and exclude the generated file from the sources jar.
    dependsOn generateGitProperties
    from sourceSets.main.allSource
    exclude 'git.properties'
}

task packageGroovydoc(type: Jar) {
    from groovydoc
    archiveClassifier.set("groovydoc")
}

publishing {
    publications {
        mavenJar(MavenPublication) {
            groupId    = project.group
            artifactId = "grails-ses-mail"
            version    = project.version
            from components.java
            artifact sourceJar
            artifact packageGroovydoc
        }
    }
    repositories {
        mavenLocal()
        maven {
            name = "NexusRepo"
            credentials {
                username project.findProperty("nexusUsername") ?: System.getenv("NEXUS_USERNAME")
                password project.findProperty("nexusPassword") ?: System.getenv("NEXUS_PASSWORD")
            }
            url project.findProperty("nexusUrl") ?: System.getenv("NEXUS_URL")
            allowInsecureProtocol = project.findProperty("isNexusUrlInsecure") ? true : false
        }
    }
}
